<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Failed — Designtub</title>
<style>
  body{font-family:sans-serif;background:#f7f7f6;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
  .box{background:#fff;border-radius:20px;padding:40px 30px;text-align:center;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
  .icon{width:64px;height:64px;border-radius:50%;background:#c0392b;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:2rem;}
  h1{font-size:1.3rem;color:#111;margin-bottom:10px;}
  p{color:#6e6e6e;font-size:0.95rem;margin-bottom:20px;}
  a{display:inline-block;padding:12px 26px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✕</div>
    <h1>Payment was not completed</h1>
    <p id="failMsg">You can go back and try the payment again.</p>
    <a href="index.html">Back to Home</a>
  </div>

 <script>
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason');
    const orderId = params.get('orderId');
    const messages = {
      cancelled: 'You cancelled the payment.',
      payment_failed: 'The payment could not be processed.',
      invalid_transaction: 'We could not verify this transaction.',
      missing_data: 'Some required data was missing.',
      server_error: 'A server error occurred. Please try again.',
      order_not_found: 'We could not find this order.',
      tran_id_mismatch: 'This payment could not be verified for your order. Please contact support.',
      validation_unreachable: 'Could not verify payment right now. Please try again shortly.',
      unauthorized_payment: 'This payment could not be verified. Please contact support.',
      amount_mismatch: 'The paid amount did not match the order total. Please contact support.'
    };
    let text = messages[reason] || 'You can go back and try the payment again.';
    if(orderId) text += ' (Order ID: ' + orderId + ')';
    document.getElementById('failMsg').textContent = text;
 </script>
